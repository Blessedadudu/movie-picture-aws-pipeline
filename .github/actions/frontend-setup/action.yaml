name: 'Frontend Setup'
description: 'Sets up NodeJS, restores the npm cache and installs frontend dependencies.'

inputs:
  node-version:
    description: 'NodeJS version to install. Should match starter/frontend/.nvmrc'
    required: false
    default: '18.14'
  working-directory:
    description: 'Directory containing package.json / package-lock.json'
    required: false
    default: starter/frontend

runs:
  using: composite
  steps:
    - name: Setup NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    # Cache ~/.npm (npm's tarball cache) rather than node_modules: smaller, and
    # `npm ci` still validates the tree against the lockfile. Keyed on the
    # lockfile hash so a dependency change busts the cache automatically.
    # Must restore before installing.
    - name: Restore npm cache
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-npm-

    # `npm ci`, not `npm install` - installs exactly what the lockfile pins.
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci
