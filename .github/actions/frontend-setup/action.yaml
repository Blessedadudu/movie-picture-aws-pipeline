name: 'Frontend Setup'
description: 'Checks out nothing; sets up NodeJS, restores the npm cache and installs frontend dependencies.'

inputs:
  node-version:
    description: 'NodeJS version to install. Should match starter/frontend/.nvmrc'
    required: false
    default: '18.14'
  working-directory:
    description: 'Directory containing package.json / package-lock.json'
    required: false
    default: starter/frontend

runs:
  using: composite
  steps:
    # Setup NodeJS. We pin the version so CI matches what the developers use
    # locally via `nvm use` (.nvmrc contains 18.14).
    - name: Setup NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    # Restore the cache BEFORE installing dependencies. We cache npm's download
    # cache (~/.npm) rather than node_modules: it is smaller, and `npm ci` will
    # still validate the tree against package-lock.json. The key is derived from
    # the lockfile hash, so a dependency change automatically busts the cache.
    - name: Restore npm cache
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-npm-

    # `npm ci` (not `npm install`) - it installs exactly what package-lock.json
    # pins, which is what makes CI runs reproducible.
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci
